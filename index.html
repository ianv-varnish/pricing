<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,300;8..60,400&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --blue-10:#E5F2FF; --blue-20:#B2D9FF; --blue-30:#66BAFF; --blue-40:#33A3FF;
    --blue-50:#008CFF; --blue-60:#0763ED; --blue-70:#0D51B8; --blue-80:#0B418C;
    --blue-90:#0D2363; --blue-100:#0B142E;
    --lime-50:#B4E52E; --lime-60:#A0CC29; --lime-80:#628012;
    --white:#FFFFFF; --gray-05:#FAFAFA; --gray-10:#F7F7F7; --gray-20:#F0F0F0;
    --gray-30:#E1E2E3; --gray-40:#B8B8B8; --gray-50:#949AA2; --gray-60:#818181;
    --gray-70:#4E5157; --gray-80:#383B40; --gray-85:#25272A; --gray-90:#141415;
    --success:#12B982;

    --font-head:'Source Serif 4', Georgia, serif;
    --font-body:'Inter', -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', 'SFMono-Regular', monospace;
  }

  *{box-sizing:border-box;}
  body{margin:0;font-family:var(--font-body);color:var(--gray-90);background:var(--gray-05);}

  /* ---------- Header ---------- */
  header{padding:56px 24px 32px; max-width:1120px; margin:0 auto; text-align:center;}
  header h1{
    font-family:var(--font-head); font-weight:300; font-size:44px; letter-spacing:-.01em;
    margin:0 0 12px; color:var(--blue-100);
  }
  header p{font-size:16px; color:var(--gray-70); max-width:560px; margin:0 auto; line-height:1.5;}

  /* ---------- Product tab bar ---------- */
  .tabbar-wrap{
    position:sticky; top:0; z-index:20; background:rgba(250,250,250,.92);
    backdrop-filter:blur(6px); border-bottom:1px solid var(--gray-30);
  }
  .tabbar{
    max-width:1120px; margin:0 auto; padding:14px 24px;
    display:flex; gap:8px; overflow-x:auto; scrollbar-width:thin;
  }
  .tab{
    font-family:var(--font-body); font-weight:500; font-size:13.5px;
    border:1px solid var(--gray-30); background:var(--white); color:var(--gray-80);
    padding:9px 16px; border-radius:100px; cursor:pointer; white-space:nowrap;
    transition:all .15s ease; text-decoration:none; display:inline-block;
  }
  .tab:hover{border-color:var(--blue-40); color:var(--blue-70);}
  .tab.active{background:var(--blue-100); border-color:var(--blue-100); color:var(--white);}

  /* ---------- Main ---------- */
  main{max-width:1120px; margin:0 auto; padding:40px 24px 100px;}
  .product-panel{display:none; scroll-margin-top:80px;}
  .product-panel.active{display:block; animation:fade .25s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:translateY(0);}}

  .product-head{margin-bottom:32px;}
  .product-head h2{font-family:var(--font-head); font-weight:300; font-size:30px; margin:0 0 8px; color:var(--blue-100);}
  .product-head p.tagline{font-size:15px; color:var(--gray-70); margin:0; max-width:640px; line-height:1.5;}
  .source-note{font-family:var(--font-mono); font-size:11.5px; color:var(--gray-50); margin-top:10px;}
  .source-note a{color:var(--blue-70); text-decoration:none;}
  .anchor-note{font-family:var(--font-mono); font-size:11px; color:var(--gray-40); margin-top:4px;}
  .anchor-note button{
    font-family:var(--font-mono); font-size:11px; color:var(--blue-70); background:none; border:none;
    padding:0; cursor:pointer; text-decoration:underline;
  }

  /* ---------- Skeleton (content-pending) primitives ---------- */
  @keyframes pulse{0%,100%{opacity:.5} 50%{opacity:.95}}
  .skel, .skel-block{background:var(--gray-20); border-radius:5px; animation:pulse 2.4s ease-in-out infinite;}
  .skel{display:inline-block; height:.8em; width:44px; vertical-align:middle;}
  .skel-block{display:block;}

  /* ---------- Engagement / process strip ---------- */
  .engagement{display:grid; gap:14px; margin-bottom:40px;}
  .engagement .step{border-radius:14px; padding:22px 20px;}
  .engagement .step .n{font-family:var(--font-head); font-size:28px; font-weight:300; opacity:.55; margin-bottom:6px;}
  .engagement .step h4{margin:0 0 6px; font-size:16px; font-weight:600;}
  .engagement .step p{margin:0; font-size:12.5px; line-height:1.4; opacity:.9;}
  p.lead{font-size:14px; color:var(--gray-70); margin:0 0 18px; line-height:1.6; max-width:700px;}

  /* ---------- Tier cards ---------- */
  .tiers{
    display:grid; gap:16px; margin-bottom:24px; align-items:stretch;
    grid-template-columns:repeat(auto-fit, minmax(230px, 1fr));
  }
  .tier-card{
    background:var(--white); border:1px solid var(--gray-30); border-radius:14px;
    padding:24px; display:flex; flex-direction:column; height:100%;
  }
  .tier-card.featured{border-color:var(--blue-50); box-shadow:0 0 0 1px var(--blue-50);}
  .badge{
    font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.06em;
    padding:3px 9px; border-radius:100px; display:inline-block; margin-bottom:14px; width:fit-content;
  }
  .badge.trial{background:var(--blue-10); color:var(--blue-70);}
  .badge.free{background:#E8FBF3; color:#0B8F63;}
  .badge.paid{background:var(--blue-100); color:var(--white);}
  .badge.custom{background:var(--blue-10); color:var(--blue-70);}
  .tier-card h3{font-size:17px; margin:0 0 6px; color:var(--gray-90);}
  .tier-card .price{font-family:var(--font-head); font-size:24px; font-weight:300; color:var(--blue-100); margin-bottom:2px;}
  .tier-card .period{font-size:12.5px; color:var(--gray-50); margin-bottom:16px;}
  .tier-card .desc{font-size:13px; color:var(--gray-70); margin-bottom:16px; line-height:1.5; min-height:34px;}
  .tier-card .cta{
    text-align:center; padding:11px; border-radius:8px; font-size:13.5px; font-weight:600;
    text-decoration:none; display:block; transition:opacity .15s; margin-bottom:18px;
  }
  .cta.primary{background:var(--blue-50); color:var(--white);}
  .cta.primary:hover{background:var(--blue-60);}
  .cta.ghost{background:var(--white); color:var(--blue-70); border:1px solid var(--blue-40);}
  .cta.ghost:hover{background:var(--blue-10);}
  .cta.cta-compact{display:inline-block; width:auto; margin-bottom:0; padding:11px 28px;}
  .tier-card ul{list-style:none; margin:0; padding:0; flex-grow:1;}
  .tier-card ul li{
    font-size:13px; color:var(--gray-80); padding:6px 0 6px 20px; position:relative; line-height:1.4;
    border-top:1px solid var(--gray-20);
  }
  .tier-card ul li:first-child{border-top:none;}
  .tier-card ul li::before{content:"✔"; color:var(--success); position:absolute; left:0; font-size:11px; top:7px;}
  .tier-card ul li.sub-head{
    font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em;
    color:var(--gray-50); padding-left:0; border-top:none; margin-top:6px;
  }
  .tier-card ul li.sub-head::before{content:none;}
  .tier-card ul.skel-list li{border-top:none; padding-left:0;}
  .tier-card ul.skel-list li::before{content:none;}

  /* ---------- Marketplace availability row ---------- */
  .mkt-row{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin:-8px 0 18px;}
  .mkt-label{font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase; letter-spacing:.05em; color:var(--gray-50);}
  a.mkt-pill{
    font-family:var(--font-mono); font-size:11.5px; color:var(--gray-80);
    border:1px solid var(--gray-30); background:var(--gray-10); border-radius:100px;
    padding:5px 12px; text-decoration:none; white-space:nowrap; transition:all .15s ease;
  }
  a.mkt-pill:hover{border-color:var(--blue-40); color:var(--blue-70); background:var(--blue-10);}
  a.mkt-pill .ext{opacity:.55; margin-left:4px;}

  /* ---------- Partner banner (e.g. CDN in a Box, folded into Varnish CDN) ---------- */
  .partner-banner{
    background:var(--blue-70); color:var(--white); border-radius:14px;
    padding:28px 30px; margin-bottom:44px;
  }
  .partner-banner .eyebrow{
    font-family:var(--font-mono); font-size:11px; text-transform:uppercase; letter-spacing:.08em;
    color:var(--blue-10); margin-bottom:10px;
  }
  .partner-banner h3{font-family:var(--font-head); font-weight:300; font-size:23px; margin:0 0 6px; color:var(--white);}
  .partner-banner .example-tag{font-family:var(--font-mono); font-size:12px; color:var(--blue-10); margin-bottom:14px;}
  .partner-banner p.desc{font-size:13.5px; color:var(--blue-10); line-height:1.6; max-width:680px; margin:0 0 22px;}
  .partner-tracks{display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:14px; margin-bottom:20px;}
  .partner-track{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); border-radius:10px; padding:16px 18px;}
  .partner-track h4{margin:0 0 6px; font-size:14px; font-weight:600; color:var(--white);}
  .partner-track p{margin:0; font-size:12.5px; color:var(--blue-10); line-height:1.5;}
  .partner-features{font-size:12.5px; color:var(--blue-10); margin-bottom:22px; line-height:1.6; max-width:680px;}
  .partner-features strong{color:var(--white);}
  .partner-banner .cta-row{display:flex; align-items:center; gap:16px; flex-wrap:wrap;}
  a.partner-cta{
    background:var(--white); color:var(--blue-70); font-weight:600; font-size:13.5px;
    padding:11px 22px; border-radius:8px; text-decoration:none; white-space:nowrap;
  }
  a.partner-cta:hover{background:var(--blue-10);}
  a.partner-source-link{
    font-family:var(--font-mono); font-size:12px; color:var(--blue-10); text-decoration:none;
  }
  a.partner-source-link:hover{color:var(--white);}

  /* ---------- Comparison table ---------- */
  .compare h4{
    font-family:var(--font-body); font-weight:600; font-size:16px; margin:0 0 16px; color:var(--gray-90);
  }
  table.feature-table{width:100%; border-collapse:collapse; background:var(--white); border-radius:12px; overflow:hidden; border:1px solid var(--gray-30);}
  table.feature-table th, table.feature-table td{
    padding:11px 16px; text-align:center; font-size:13px; border-bottom:1px solid var(--gray-20);
    font-family:var(--font-mono);
  }
  table.feature-table th{background:var(--blue-100); color:var(--white); font-weight:500; font-size:12px;}
  table.feature-table td:first-child, table.feature-table th:first-child{
    text-align:left; font-family:var(--font-body); font-size:13px; color:var(--gray-80); width:34%;
  }
  .row-desc{
    font-family:var(--font-body); font-size:11.5px; color:var(--gray-50); font-weight:400;
    margin-top:3px; line-height:1.4;
  }
  table.feature-table tr.group-row td{
    background:var(--gray-10); font-family:var(--font-body); font-weight:600; text-align:left;
    color:var(--blue-80); font-size:12px; text-transform:uppercase; letter-spacing:.04em;
  }
  table.feature-table tr:last-child td{border-bottom:none;}
  .yes{color:var(--success); font-weight:600;}
  .no{color:var(--gray-40);}
  .addon{color:var(--blue-70); font-weight:500;}
  .footnote{font-size:11.5px; color:var(--gray-50); margin-top:10px; font-family:var(--font-mono);}

  @media (max-width:640px){
    header h1{font-size:32px;}
    .product-head h2{font-size:24px;}
    .engagement{grid-template-columns:1fr !important;}
    .tiers{max-width:none !important;}
  }
</style>
</head>

/* ============================================================
   RENDER HELPERS
   ============================================================ */
const tabbar = document.getElementById('tabbar');
const main = document.getElementById('main');

function skelLine(w, h){ return `<span class="skel-block" style="width:${w};height:${h||'12px'};"></span>`; }

function cellHTMLFixed(val){
  if (val === 'yes') return '<span class="yes">✔</span>';
  if (val === 'no') return '<span class="no">–</span>';
  if (val === 'addon') return '<span class="addon">Add-on</span>';
  if (!val) return `<span class="skel" style="width:28px;margin:0 auto;"></span>`;
  return val;
}

function thText(h){
  return h ? h : `<span class="skel" style="width:56px;"></span>`;
}

function getFeatureGroups(p){
  if (p.featureGroups && p.featureGroups.length) return p.featureGroups;
  const cols = p.twoColHeaders ? p.twoColHeaders.length : Math.max(p.tiers.length, 1);
  const blankRow = () => ['', Array(cols).fill('')];
  return [{ title: '', rows: [blankRow(), blankRow(), blankRow(), blankRow(), blankRow()] }];
}

function renderTierCard(t){
  const classes = ['tier-card'];
  if (t.featured) classes.push('featured');

  const badgeHTML = t.badge
    ? `<span class="badge ${['trial','free','paid'].includes(t.badge) ? t.badge : 'custom'}">${{trial:'Free trial', free:'Free', paid:'Paid'}[t.badge] || t.badge}</span>`
    : `<span class="skel" style="width:64px;height:18px;border-radius:100px;margin-bottom:14px;"></span>`;

  const nameHTML = t.name
    ? `<h3>${t.name}</h3>`
    : `<h3>${skelLine('70%', '17px')}</h3>`;

  const priceHTML = t.price
    ? `<div class="price">${t.price}</div>`
    : `<div class="price">${skelLine('64px', '24px')}</div>`;

  const periodHTML = t.period
    ? `<div class="period">${t.period}</div>`
    : `<div class="period">${skelLine('50%', '11px')}</div>`;

  const descHTML = t.desc
    ? `<div class="desc">${t.desc}</div>`
    : `<div class="desc">${skelLine('100%', '11px')}<div style="height:6px;"></div>${skelLine('76%', '11px')}</div>`;

  const ctaHTML = t.cta
    ? (t.cta.compact
        ? `<div style="margin-bottom:18px;"><a class="cta cta-compact ${t.cta.style}" href="${t.cta.href || '#'}" target="${t.cta.href && t.cta.href !== '#' ? '_blank' : '_self'}" rel="noopener">${t.cta.label}</a></div>`
        : `<a class="cta ${t.cta.style}" href="${t.cta.href || '#'}" target="${t.cta.href && t.cta.href !== '#' ? '_blank' : '_self'}" rel="noopener">${t.cta.label}</a>`)
    : `<div class="cta" style="padding:0;margin-bottom:18px;">${skelLine('100%', '38px')}</div>`;

  /* Marketplace availability: an extensible list of listings (AWS today,
     Azure/GCP later). Each entry is {name, href}; adding a marketplace is
     one array entry, no layout change. */
  const mktHTML = (t.marketplaces && t.marketplaces.length)
    ? `<div class="mkt-row"><span class="mkt-label">Available on</span>${
        t.marketplaces.map(m => `<a class="mkt-pill" href="${m.href}" target="_blank" rel="noopener">${m.name}<span class="ext">↗</span></a>`).join('')
      }</div>`
    : '';

  let bulletsHTML;
  if (t.bullets && t.bullets.length) {
    bulletsHTML = '<ul>' + t.bullets.map(b => {
      if (typeof b === 'object') return `<li class="sub-head">${b.sub}</li>`;
      return `<li>${b}</li>`;
    }).join('') + '</ul>';
  } else {
    bulletsHTML = '<ul class="skel-list">' + [92, 68, 80].map(w =>
      `<li>${skelLine(w + '%', '10px')}</li>`
    ).join('') + '</ul>';
  }

  /* CTA sits right after price/desc, before the (variable-length) bullet
     list, so every card's button lands in the same band and is visible
     without scrolling past a long feature list first. */
  return `<div class="${classes.join(' ')}">
    ${badgeHTML}
    ${nameHTML}
    ${priceHTML}
    ${periodHTML}
    ${descHTML}
    ${ctaHTML}
    ${mktHTML}
    ${bulletsHTML}
  </div>`;
}

function renderEngagement(steps){
  return `<div class="engagement" style="grid-template-columns:repeat(${steps.length}, 1fr);">${steps.map(s => `
    <div class="step" style="background:${s.bg}; color:${s.fg};">
      <div class="n">${s.n}</div>
      <h4>${s.title}</h4>
      <p>${s.tagline}</p>
    </div>
  `).join('')}</div>`;
}

function renderPartnerBanner(b){
  return `<div class="partner-banner">
    <div class="eyebrow">${b.eyebrow}</div>
    <h3>${b.title}</h3>
    <div class="example-tag">${b.exampleTag}</div>
    <p class="desc">${b.desc}</p>
    <div class="partner-tracks">
      ${b.tracks.map(t => `<div class="partner-track"><h4>${t.title}</h4><p>${t.body}</p></div>`).join('')}
    </div>
    <div class="partner-features"><strong>${b.featuresLabel || 'Feature set:'}</strong> ${b.features}</div>
    <div class="cta-row">
      <a class="partner-cta" href="${b.cta.href}" target="${(b.cta.href !== '#' && !b.cta.href.startsWith('#')) ? '_blank' : '_self'}" rel="noopener" ${b.cta.href.startsWith('#') && b.cta.href !== '#' ? `onclick="event.preventDefault(); selectProduct('${b.cta.href.slice(1)}', true); window.scrollTo({top:0});"` : ''}>${b.cta.label}</a>
      ${b.source ? `<a class="partner-source-link" href="${b.source}" target="_blank" rel="noopener">Product page →</a>` : ''}
    </div>
  </div>`;
}

/* ============================================================
   BUILD PAGE
   ============================================================ */
PRODUCTS.forEach((p, idx) => {
  const tab = document.createElement('a');
  tab.className = 'tab' + (idx === 0 ? ' active' : '');
  tab.textContent = p.name;
  tab.href = '#' + p.id;
  tab.dataset.id = p.id;
  tab.addEventListener('click', (e) => {
    e.preventDefault();
    selectProduct(p.id, true);
  });
  tabbar.appendChild(tab);

  const panel = document.createElement('section');
  panel.className = 'product-panel' + (idx === 0 ? ' active' : '');
  panel.id = p.id;

  let html = `
    <div class="product-head">
      <h2>${p.name}</h2>
      <p class="tagline">${p.tagline}</p>
      ${p.source ? `<div class="source-note"><a href="${p.source}" target="_blank" rel="noopener">Product page →</a></div>` : ''}
      <div class="anchor-note">Direct link: <button type="button" class="copy-link" data-id="${p.id}">#${p.id}</button></div>
    </div>
  `;

  const tiersStyle = p.tiers.length === 1 ? ' style="max-width:calc(50% - 8px);"' : '';
  html += `<div class="tiers"${tiersStyle}>` + p.tiers.map(renderTierCard).join('') + '</div>';

  if (p.partnerBanner) {
    html += renderPartnerBanner(p.partnerBanner);
  }

  if (p.engagementModel) {
    if (p.processIntro) html += `<p class="lead">${p.processIntro}</p>`;
    html += renderEngagement(p.engagementModel);
  }

  const hasFeatures = p.featureGroups && p.featureGroups.length > 0;
  if (hasFeatures) {
    const groups = p.featureGroups;
    const headers = p.twoColHeaders || p.tiers.map(t => t.name);
    const colCount = headers.length;

    html += `<div class="compare"><h4>Feature comparison</h4><table class="feature-table"><thead><tr><th>Feature</th>${
      headers.map(h => `<th>${thText(h)}</th>`).join('')
    }</tr></thead><tbody>`;
    groups.forEach(g => {
      if (g.title) html += `<tr class="group-row"><td colspan="${colCount + 1}">${g.title}</td></tr>`;
      g.rows.forEach(row => {
        const [label, values, desc] = row;
        const labelHTML = label ? label : skelLine('60%', '10px');
        const descHTML = desc ? `<div class="row-desc">${desc}</div>` : '';
        html += `<tr><td>${labelHTML}${descHTML}</td>${values.map(v => `<td>${cellHTMLFixed(v)}</td>`).join('')}</tr>`;
      });
    });
    html += '</tbody></table></div>';
  }
  if (p.footnote) html += `<div class="footnote">${p.footnote}</div>`;

  panel.innerHTML = html;
  main.appendChild(panel);
});

function selectProduct(id, updateHash){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.id === id));
  document.querySelectorAll('.product-panel').forEach(p => p.classList.toggle('active', p.id === id));
  if (updateHash && history.pushState) {
    /* Sandboxed previews (about:srcdoc iframes) forbid pushState and throw a
       SecurityError. The tab switch above has already happened, so if the URL
       can't be updated we just skip it rather than surfacing an error. */
    try {
      history.pushState(null, '', '#' + id);
    } catch (e) { /* no-op: URL hash unavailable in this context */ }
  }
}

/* Copy-link buttons next to each product heading */
main.addEventListener('click', (e) => {
  const btn = e.target.closest('.copy-link');
  if (!btn) return;
  const url = window.location.href.split('#')[0] + '#' + btn.dataset.id;
  if (navigator.clipboard) {
    navigator.clipboard.writeText(url).then(() => {
      const original = btn.textContent;
      btn.textContent = 'Copied!';
      setTimeout(() => { btn.textContent = original; }, 1200);
    });
  }
});

/* Open the product matching the URL hash on load, and respond to
   back/forward navigation or a hash typed/pasted directly. */
function openFromHash(){
  const id = window.location.hash.replace('#', '');
  if (id && PRODUCTS.some(p => p.id === id)) {
    selectProduct(id, false);
  }
}
window.addEventListener('hashchange', openFromHash);
openFromHash();
</script>
